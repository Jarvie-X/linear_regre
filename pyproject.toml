[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "linear-regre"
version = "0.1.0"
description = "Repeatable workflows for linear regression datasets"
requires-python = ">=3.9"
dependencies = ["scikit-learn>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
